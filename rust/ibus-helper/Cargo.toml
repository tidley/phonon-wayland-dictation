[package]
name = "phonon-ibus-helper"
version = "0.1.0"
edition = "2021"
publish = false
description = "Experimental native IBus output engine for Phonon dictation"
license = "MIT"

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "net", "io-util", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xkbcommon = { version = "0.9", default-features = false }
uuid = { version = "1", features = ["v4"] }
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }
